<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini GAI CRM – AI Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #chatBox {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      background-color: #fff;
      border: 1px solid #dee2e6;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
    }
    .msg {
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      margin-bottom: 0.5rem;
      max-width: 75%;
      word-wrap: break-word;
    }
    .msg.user {
      margin-left: auto;
      background-color: #0d6efd;
      color: #fff;
    }
    .msg.ai {
      margin-right: auto;
      background-color: #e9ecef;
      color: #212529;
    }
    .hidden-json {
      display: none;
      margin-top: 0.5rem;
      padding: 1rem;
      background: #212529;
      color: #f8f9fa;
      border-radius: 0.5rem;
      font-family: monospace;
      white-space: pre;
      overflow-x: auto;
    }
    .toggle-json {
      cursor: pointer;
      color: #0d6efd;
      font-size: 0.9rem;
    }
  </style>
</head>
<body class="container py-3">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">💬 Mini GAI CRM Chat</h1>
    <div class="d-flex gap-3 align-items-center">
      <a href="/generated" class="btn btn-outline-primary btn-sm">📂 Generated Modules</a>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="umlMode">
        <label class="form-check-label" for="umlMode">UML Mode</label>
      </div>
    </div>
  </div>

  <div id="chatBox"></div>

  <div class="input-group">
    <input type="text" id="chatInput" class="form-control form-control-lg" placeholder="Type your requirement or answer...">
    <button id="sendChat" class="btn btn-primary btn-lg">Send</button>
  </div>

  <script>
    let lastSpec = null;
    let lastFiles = null;
    let lastFeedback = null;

    function addMessage(text, sender="ai") {
      $("#chatBox").append(`<div class="msg ${sender}">${text}</div>`);
      $("#chatBox").scrollTop($("#chatBox")[0].scrollHeight);
    }

    function addJsonBlock(title, obj) {
      let id = "json_" + Date.now();
      $("#chatBox").append(`
        <div class="msg ai">
          <span class="toggle-json" data-target="${id}">${title} (click to expand)</span>
          <div id="${id}" class="hidden-json">${JSON.stringify(obj, null, 2)}</div>
        </div>
      `);
      $(".toggle-json").off("click").on("click", function() {
        let target = $(this).data("target");
        $("#" + target).toggle();
      });
      $("#chatBox").scrollTop($("#chatBox")[0].scrollHeight);
    }

    function addFilesBlock(files) {
      let idBase = "file_" + Date.now();
      Object.keys(files).forEach((fname, idx) => {
        let id = idBase + "_" + idx;
        $("#chatBox").append(`
          <div class="msg ai">
            <span class="toggle-json" data-target="${id}">📄 ${fname} (click to expand)</span>
            <div id="${id}" class="hidden-json">${escapeHtml(files[fname])}</div>
          </div>
        `);
      });
      $(".toggle-json").off("click").on("click", function() {
        let target = $(this).data("target");
        $("#" + target).toggle();
      });
      $("#chatBox").scrollTop($("#chatBox")[0].scrollHeight);
    }

    function escapeHtml(text) {
      return text.replace(/[&<>'"]/g, function (c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    // ---------------------------
    // Chat flow
    // ---------------------------
    $("#sendChat").on("click", function() {
      const msg = $("#chatInput").val();
      if (!msg) return;
      $("#chatInput").val("");
      addMessage(msg, "user");

      $.ajax({
        url: "/interpreter/process",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({ message: msg }),
        success: function(res) {
          addMessage("<b>Summary:</b> " + res.text, "ai");
          if (res.clarifications.length > 0) {
            res.clarifications.forEach(q => addMessage("❓ " + q, "ai"));
            $("#chatBox").append(`<button id="approveBtn" class="btn btn-success btn-sm">✅ Approve</button>`);
            $("#approveBtn").on("click", confirmSpec);
          } else {
            confirmSpec();
          }
        }
      });
    });

    function confirmSpec() {
      $.post("/interpreter/confirm", {}, function(res) {
        addMessage("✅ Approved summary: " + res.text, "ai");

        let mode = $("#umlMode").is(":checked") ? "uml" : "nl";
        lastSpec = res.text;

        if (mode === "uml") {
          $.ajax({
            url: "/uml/translate",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify({ summary: res.text }),
            success: function(umlRes) {
              if (umlRes.status === "ok") {
                addJsonBlock("📐 UML JSON Spec", umlRes.json);
                lastSpec = umlRes.json;
                runCodegen("uml", umlRes.json);
              } else {
                addMessage("⚠️ UML translation failed.", "ai");
              }
            }
          });
        } else {
          runCodegen("nl", res.text);
        }
      });
      $("#approveBtn").remove();
    }

    function runCodegen(mode, spec) {
      addMessage("⚙️ Generating code...", "ai");

      let payload = mode === "uml" ? { mode: "uml", spec_json: spec } : { mode: "nl", spec: spec };

      $.ajax({
        url: "/codegen/run",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify(payload),
        success: function(cgRes) {
          if (cgRes.files) {
            lastFiles = cgRes.files;
            addFilesBlock(cgRes.files);
          }
          addMessage("🔍 Running validation...", "ai");

          runValidation(lastSpec, lastFiles);
        }
      });
    }

    function runValidation(spec, files) {
      $.ajax({
        url: "/validate/run",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({ spec: spec, files: files }),
        success: function(valRes) {
          if (valRes.validation.status === "ok") {
            addMessage(`✅ Validation passed: All tests succeeded.<br><a href="/generated" class="btn btn-success btn-sm mt-2">📂 View Generated Modules</a>`, "ai");
          } else {
            addMessage("⚠️ Validation failed at stage: " + valRes.validation.stage, "ai");
            addMessage("👉 " + valRes.validation.message, "ai");
            if (valRes.feedback) {
              lastFeedback = valRes.feedback;
              addJsonBlock("🛠 Feedback instructions", valRes.feedback);
              $("#autoFixBtn").remove();
              $("#chatBox").append(`<button id="autoFixBtn" class="btn btn-warning btn-sm">🔧 Auto Repair</button>`);
              $("#autoFixBtn").on("click", autoRepair);
            }
          }
        }
      });
    }

    function autoRepair() {
      addMessage("🔧 Applying auto-repair based on feedback...", "ai");

      $.ajax({
        url: "/codegen/fix",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({
          spec: lastSpec,
          artefacts: lastFiles,
          feedback: lastFeedback
        }),
        success: function(fixRes) {
          if (fixRes.files) {
            lastFiles = fixRes.files;
            addFilesBlock(fixRes.files);
          }
          addMessage("🔍 Re-running validation after fix...", "ai");
          runValidation(lastSpec, lastFiles);
        }
      });
    }

    // Odesílání zprávy klávesou Enter
    $("#chatInput").on("keypress", function(e) {
      if (e.which === 13 && !e.shiftKey) {
        e.preventDefault();
        $("#sendChat").click();
      }
    });
  </script>
</body>
</html>
